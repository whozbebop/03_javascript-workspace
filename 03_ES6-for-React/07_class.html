<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 객체 생성 방법1. 객체 리터럴 {}
      const person = {
        name: "홍길동",
        age: 20,
        getInfo: function () {
          return `${this.name}은(는) ${this.age}세 입니다`;
        },
      };
      console.log(person);
      console.log(person.name);
      console.log(person.getInfo());
    </script>
  </body>
</html>
